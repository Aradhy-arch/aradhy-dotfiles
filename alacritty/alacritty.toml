[general]
import = ["~/.config/alacritty/colors.toml"]

[window]
opacity = 0.75
blur = true
padding = { x = 15, y = 15 }
dynamic_padding = true
decorations = "none"

[font]
size = 11.0

[font.normal]
family = "Iosevka Nerd Font"
style = "Regular"

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"

[keyboard]
bindings = [{ key = "NumpadEnter", chars = "\r" }]
